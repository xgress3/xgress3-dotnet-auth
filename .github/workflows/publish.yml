name: Publish

on:
  push:
    tags:
      - 'v*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for NuGet trusted publishing (OIDC token issuance)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - run: dotnet test tests/Xg3.Auth.Tests --framework net6.0
      - run: dotnet test tests/Xg3.Auth.Tests --framework net8.0
      - run: dotnet test tests/Xg3.Auth.ClientIntegration.Tests --framework net6.0
      - run: dotnet test tests/Xg3.Auth.ClientIntegration.Tests --framework net8.0
      - run: chmod +x tools/validate-package.sh
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - run: ./tools/validate-package.sh
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # your nuget.org profile name (NOT email)
      - run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
      - run: dotnet nuget push ./artifacts/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
