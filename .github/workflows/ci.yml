name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - run: dotnet test tests/Xg3.Auth.Tests --framework net6.0
      - run: dotnet test tests/Xg3.Auth.Tests --framework net8.0
      - run: dotnet test tests/Xg3.Auth.ClientIntegration.Tests --framework net6.0
      - run: dotnet test tests/Xg3.Auth.ClientIntegration.Tests --framework net8.0
      - run: chmod +x tools/validate-package.sh
      - run: ./tools/validate-package.sh
